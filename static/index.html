<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI聊天机器人</title>
    <style>
        body{max-width:700px;margin:20px auto;font-family:Arial}
        .box{border:1px solid #ddd;border-radius:10px;padding:15px;height:400px;overflow-y:auto;margin-bottom:10px}
        .msg{margin:8px 0;padding:10px;border-radius:8px}
        .user{background:#e3f2fd;text-align:right}
        .bot{background:#f5f5f5;text-align:left}
        input{width:78%;padding:10px;border-radius:8px;border:1px solid #ddd}
        button{width:20%;padding:10px;background:#0d6efd;color:white;border:none;border-radius:8px}
    </style>
</head>
<body>
    <h2>Web 聊天机器人</h2>
    <div class="box" id="box"></div>
    <input id="input" placeholder="输入问题..." autocomplete="off">
    <button onclick="send()">发送</button>

    <script>
        async function send() {
            let msg = input.value.trim();
            if (!msg) return;
            box.innerHTML += `<div class="msg user">${msg}</div>`;
            input.value = '';

            let res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            let data = await res.json();
            box.innerHTML += `<div class="msg bot">${data.reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
